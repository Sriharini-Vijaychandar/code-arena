services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codearena_piston
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - ./piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      - PISTON_RUN_TIMEOUT=6000
      - PISTON_COMPILE_TIMEOUT=15000
      - PISTON_OUTPUT_MAX_SIZE=1048576
      - PISTON_MAX_PROCESS_COUNT=64
      - PISTON_DISABLE_NETWORKING=true